<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Femtech Map, women's health innovation worldwide</title>
    <meta name="description" content="A map of femtech and women's health innovation around the world, startups, clinics and communities building better care for women, everywhere." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21.5S5.5 15.8 5.5 10.5A6.5 6.5 0 0 1 12 4a6.5 6.5 0 0 1 6.5 6.5c0 5.3-6.5 11-6.5 11Z" />
              <circle cx="12" cy="10.4" r="2.4" />
            </svg>
          </div>
          <div>
            <h1>Global Femtech Map</h1>
            <p class="tagline">Women's health innovation worldwide</p>
          </div>
        </header>

        <div class="thesis">
          <p class="thesis-body">A map of femtech and women's health innovation around the world, the startups, clinics and communities building better care for women, everywhere.</p>
        </div>

        <div class="counts" id="counts"></div>

        <div class="controls">
          <input id="search" type="search" placeholder="Search initiatives, countries…" aria-label="Search initiatives" autocomplete="off" />
          <div class="toggles">
            <button class="toggle" data-toggle="podcast" aria-pressed="false">🎙 Blush &amp; Bloom founders</button>
          </div>
          <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
        </div>

        <div class="legend">
          <p class="legend-title">Initiatives mapped per country</p>
          <div class="ramp" id="ramp"></div>
          <div class="ramp-labels"><span>1</span><span>8+</span></div>
        </div>

        <footer class="credit">
          <p>Built by Gigi Kenneth · host of <a href="https://www.asele.tech/blush-and-bloom-podcast" target="_blank" rel="noopener">Blush &amp; Bloom</a></p>
          <p class="disclaimer" id="disclaimer"></p>
        </footer>
      </aside>

      <main id="map-wrap">
        <div id="map"></div>
        <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
        <button id="reset" class="reset" title="Reset view" aria-label="Reset map view">⤢</button>
      </main>

      <section id="panel" class="panel" aria-hidden="true">
        <button id="panel-close" class="panel-close" aria-label="Close details">×</button>
        <div id="panel-body"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
